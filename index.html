<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7A311D">
<meta name="robots" content="noindex">
<title>Marrakech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Hanken+Grotesk:wght@400;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4E6D3;--ink:#3A1F17;--muted:#7B5E52;--line:#E3C9A5;--surface:#FFF8EC;--accent:#1F3FA8;--accentink:#FFFFFF;--saffron:#D4A23A;--hero:#7A311D;--display:'Reem Kufi','Cormorant Garamond',Georgia,serif;
 --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1E110C;--ink:#F6E7D0;--muted:#CDB49F;--line:#4A3025;--surface:#2B1A13;--accent:#E3B64F;--accentink:#2A1608;--hero:#4A1F14}}
:root[data-theme="dark"]{--bg:#1E110C;--ink:#F6E7D0;--muted:#CDB49F;--line:#4A3025;--surface:#2B1A13;--accent:#E3B64F;--accentink:#2A1608;--hero:#4A1F14}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:auto;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg) url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%20viewBox%3D%27-22%20-22%2044%2044%27%3E%3Cpath%20d%3D%27M0-20%20L5.6-8.4%20L18.5-7.7%20L8.6%201.9%20L11.4%2014.7%20L0%208.4%20L-11.4%2014.7%20L-8.6%201.9%20L-18.5-7.7%20L-5.6-8.4Z%27%20fill%3D%27none%27%20stroke%3D%27%238C3B22%27%20stroke-opacity%3D%270.075%27%20stroke-width%3D%271.2%27/%3E%3C/svg%3E");background-size:44px 44px;color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top converter bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero)}
.fx{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:6px;color:#F8EBCB;padding:8px 10px}
.fld,.rate{display:flex;align-items:center;gap:5px;font-size:14px}
.fx input{font:inherit;font-weight:600;color:#2A1D18;background:#FBF6EF;border:0;border-radius:999px;padding:6px 10px;min-height:36px;width:76px;text-align:right}
.rate{margin-left:6px;color:#D9C8B8;font-size:13px}
.rate input{width:56px;text-align:center;background:transparent;color:#F8EBCB;border:1px dashed #D4A23A}
.fx b{font-weight:600;font-size:13px}.eq{opacity:.7}

#app{max-width:560px;margin:0 auto}
.screen{padding-bottom:12px}

/* home */

.hero{position:relative;aspect-ratio:1/.95;background-size:cover;background-position:center 30%;color:#F8EBCB;display:flex;align-items:flex-end;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(74,28,14,.94) 0,rgba(74,28,14,.55) 26%,rgba(74,28,14,0) 52%)}
.herotx{position:relative;z-index:1;padding:0 20px 22px;width:100%;text-align:center}
.hero h1{font-family:var(--serif);font-weight:700;font-size:clamp(46px,14vw,84px);line-height:1;margin:0 0 4px;letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.hero p{font-family:var(--serif);font-style:italic;font-size:clamp(19px,5vw,24px);color:#F0C766;margin:0}
.logo{width:58px;height:58px;border-radius:50%;border:2px solid var(--saffron);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hero .logo{position:absolute;top:14px;left:14px;z-index:2}
.sign{display:flex;flex-direction:column;align-items:center;gap:8px;margin:26px 0 8px}
.sign .logo{width:64px;height:64px;box-shadow:none}
.sign p{margin:0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.home{padding:18px 16px 8px}
.riadcard{background:var(--surface);border:1px solid var(--saffron);border-radius:20px;padding:16px 18px}
.riadcard .lab{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.riadcard h2{font-family:var(--serif);font-size:26px;line-height:1.15;margin:4px 0 4px}
.riadcard .gps{margin:0 0 12px;color:var(--muted);font-size:14px}
.sub{font-family:var(--serif);font-size:26px;margin:26px 2px 12px}
.daycard{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--day);border-radius:18px;padding:12px 14px;margin-bottom:12px}
.dn{display:flex;flex-direction:column;align-items:center;background:var(--day);color:#fff;border-radius:14px;padding:8px 0}
.dn b{font-family:var(--serif);font-size:30px;line-height:1}.dn small{font-size:12px;opacity:.9}
.dt b{font-family:var(--serif);font-size:22px;line-height:1.1;display:block}
.dt small{display:block;color:var(--muted);font-size:13px;margin:2px 0 8px}
.minis{display:flex;gap:6px}
.mini{width:28px;height:34px;border-radius:999px 999px 4px 4px;background-size:cover;background-position:center;border:1.5px solid var(--saffron)}
.arrow{font-size:28px;color:var(--muted)}

/* day */
.screen{--dayt:var(--day)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .screen{--dayt:var(--day-dark)}}
:root[data-theme="dark"] .screen{--dayt:var(--day-dark)}
.dayhead{display:flex;align-items:center;gap:16px;margin:16px 16px 0;background-color:var(--day);background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%20viewBox%3D%27-22%20-22%2044%2044%27%3E%3Cpath%20d%3D%27M0-20%20L5.6-8.4%20L18.5-7.7%20L8.6%201.9%20L11.4%2014.7%20L0%208.4%20L-11.4%2014.7%20L-8.6%201.9%20L-18.5-7.7%20L-5.6-8.4Z%27%20fill%3D%27none%27%20stroke%3D%27%23ffffff%27%20stroke-opacity%3D%270.14%27%20stroke-width%3D%271.2%27/%3E%3C/svg%3E");background-size:44px 44px;outline:1.5px solid rgba(212,162,58,.9);outline-offset:-7px;color:#fff;border-radius:22px;padding:20px 22px}
.dayhead .num{font-family:var(--serif);font-weight:700;font-size:70px;line-height:.9}
.dayhead .jour{margin:0;font-size:14px;opacity:.92}
.dayhead h2{font-family:var(--serif);font-weight:700;font-size:31px;line-height:1.08;margin:2px 0 0}
.stops{list-style:none;margin:8px 0 0;padding:0 16px}
.seg h3{font-family:var(--serif);font-style:italic;font-weight:700;font-size:24px;color:var(--dayt);margin:24px 4px 8px}
.stop{margin-bottom:10px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--day);border-radius:18px;overflow:hidden}
.head{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;min-height:64px;padding:12px 12px 12px 12px;background:none;border:0;text-align:left}
.head.static{display:block;padding:14px 16px;min-height:0}
.thumb{width:56px;height:70px;border-radius:999px 999px 6px 6px;background-size:cover;background-position:center;border:2px solid var(--saffron)}
.tx b{display:block;font-family:var(--serif);font-size:21px;line-height:1.15;font-weight:700}
.tx em{display:block;font-style:normal;font-size:13px;font-weight:600;color:var(--dayt);margin-top:2px}
.tx .note{margin:4px 0 0;font-size:14px;color:var(--muted)}
.t{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--day);border-radius:999px;padding:1px 9px;margin-bottom:5px;font-variant-numeric:tabular-nums}
.chev{width:24px;height:24px;fill:var(--muted);transition:transform .2s}
.head[aria-expanded="true"] .chev{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
.chip{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:0 12px 12px;padding:10px 12px;border-radius:14px;text-decoration:none;background:rgba(127,127,127,.10);background:color-mix(in srgb,var(--day) 11%,var(--surface))}
.chip .ic svg{width:22px;height:22px;fill:var(--dayt);display:block}
.ct b{display:inline;font-size:14px;font-weight:600}
.ct small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.ct .x{display:inline-block;margin-left:8px;background:var(--saffron);color:#2A1D18;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.chip .go{font-size:13px;font-weight:600;color:var(--dayt)}
.panel{padding:0 16px 16px 16px}
.panel p{margin:0 0 10px;font-size:15px;line-height:1.55}
.panel .addr{display:flex;gap:6px;align-items:flex-start;color:var(--muted);font-size:13.5px}
.panel .addr svg{width:16px;height:16px;fill:var(--muted);flex:0 0 auto;margin-top:2px}
.maps{display:block;text-align:center;background:var(--accent);color:var(--accentink);text-decoration:none;font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;min-height:46px}

/* bottom tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{flex:1 1 0;max-width:112px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px 2px;font-size:12px;font-weight:600;color:var(--muted);min-height:52px}
.ti{width:34px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.ti svg{width:22px;height:22px;fill:currentColor}
.ti b{font-family:var(--serif);font-size:17px}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"] .ti{background:var(--day,var(--hero));color:#fff}
@media (max-width:380px){.fx input{width:62px;padding:6px 8px}.rate{margin-left:2px}.rate span{display:none}}

.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.maps.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--saffron);font-family:inherit}
.maps{cursor:pointer;border:0;font-family:inherit}
.maps.ghost{border:1.5px solid var(--saffron)}
.tools{display:flex;justify-content:flex-end;padding:10px 16px 0}
.expandall{background:none;border:1px solid var(--line);color:var(--muted);font-size:13px;font-weight:600;border-radius:999px;padding:8px 14px;min-height:36px}
.today{display:inline-block;background:var(--saffron);color:#2A1D18;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;margin:2px 0 4px}
.tab.is-today::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--saffron);position:absolute;top:6px;right:calc(50% - 22px)}
.tab{position:relative}
.screen{animation:fadein .2s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(40,14,8,.72);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--surface);border-radius:26px 26px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;text-align:center}
.sheet .lab{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}
.sheet h2{font-family:var(--serif);font-size:clamp(34px,10vw,48px);line-height:1.08;margin:0}
.sheet .gps{margin:0;color:var(--muted)}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%20viewBox%3D%27-22%20-22%2044%2044%27%3E%3Cpath%20d%3D%27M0-20%20L5.6-8.4%20L18.5-7.7%20L8.6%201.9%20L11.4%2014.7%20L0%208.4%20L-11.4%2014.7%20L-8.6%201.9%20L-18.5-7.7%20L-5.6-8.4Z%27%20fill%3D%27none%27%20stroke%3D%27%23D4A23A%27%20stroke-opacity%3D%270.07%27%20stroke-width%3D%271.2%27/%3E%3C/svg%3E")}}
:root[data-theme="dark"] body{background-image:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2744%27%20height%3D%2744%27%20viewBox%3D%27-22%20-22%2044%2044%27%3E%3Cpath%20d%3D%27M0-20%20L5.6-8.4%20L18.5-7.7%20L8.6%201.9%20L11.4%2014.7%20L0%208.4%20L-11.4%2014.7%20L-8.6%201.9%20L-18.5-7.7%20L-5.6-8.4Z%27%20fill%3D%27none%27%20stroke%3D%27%23D4A23A%27%20stroke-opacity%3D%270.07%27%20stroke-width%3D%271.2%27/%3E%3C/svg%3E")}
/* Marrakech details */
.topbar::after{content:"";display:block;height:14px;background:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2756%27%20height%3D%2714%27%20viewBox%3D%270%200%2056%2014%27%3E%3Crect%20width%3D%2756%27%20height%3D%2714%27%20fill%3D%27%23FFF8EC%27/%3E%3Cpath%20d%3D%27M14.00%200.60%20L15.22%204.04%20L18.53%202.47%20L16.96%205.78%20L20.40%207.00%20L16.96%208.22%20L18.53%2011.53%20L15.22%209.96%20L14.00%2013.40%20L12.78%209.96%20L9.47%2011.53%20L11.04%208.22%20L7.60%207.00%20L11.04%205.78%20L9.47%202.47%20L12.78%204.04Z%27%20fill%3D%27%231F3FA8%27/%3E%3Cpath%20d%3D%27M42.00%200.60%20L43.22%204.04%20L46.53%202.47%20L44.96%205.78%20L48.40%207.00%20L44.96%208.22%20L46.53%2011.53%20L43.22%209.96%20L42.00%2013.40%20L40.78%209.96%20L37.47%2011.53%20L39.04%208.22%20L35.60%207.00%20L39.04%205.78%20L37.47%202.47%20L40.78%204.04Z%27%20fill%3D%27%2317745A%27/%3E%3Cpath%20d%3D%27M28%203%20L31%207%20L28%2011%20L25%207Z%20M0%203%20L3%207%20L0%2011Z%20M56%203%20L53%207%20L56%2011Z%27%20fill%3D%27%23B5502F%27/%3E%3Ccircle%20cx%3D%2714%27%20cy%3D%277%27%20r%3D%271.3%27%20fill%3D%27%23D4A23A%27/%3E%3Ccircle%20cx%3D%2742%27%20cy%3D%277%27%20r%3D%271.3%27%20fill%3D%27%23D4A23A%27/%3E%3Crect%20width%3D%2756%27%20height%3D%271%27%20fill%3D%27%23D4A23A%27/%3E%3Crect%20y%3D%2713%27%20width%3D%2756%27%20height%3D%271%27%20fill%3D%27%23D4A23A%27/%3E%3C/svg%3E") repeat-x;background-size:56px 14px}
.tabbar::before{content:"";position:absolute;left:0;right:0;top:-14px;height:14px;background:url("data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%2756%27%20height%3D%2714%27%20viewBox%3D%270%200%2056%2014%27%3E%3Crect%20width%3D%2756%27%20height%3D%2714%27%20fill%3D%27%23FFF8EC%27/%3E%3Cpath%20d%3D%27M14.00%200.60%20L15.22%204.04%20L18.53%202.47%20L16.96%205.78%20L20.40%207.00%20L16.96%208.22%20L18.53%2011.53%20L15.22%209.96%20L14.00%2013.40%20L12.78%209.96%20L9.47%2011.53%20L11.04%208.22%20L7.60%207.00%20L11.04%205.78%20L9.47%202.47%20L12.78%204.04Z%27%20fill%3D%27%231F3FA8%27/%3E%3Cpath%20d%3D%27M42.00%200.60%20L43.22%204.04%20L46.53%202.47%20L44.96%205.78%20L48.40%207.00%20L44.96%208.22%20L46.53%2011.53%20L43.22%209.96%20L42.00%2013.40%20L40.78%209.96%20L37.47%2011.53%20L39.04%208.22%20L35.60%207.00%20L39.04%205.78%20L37.47%202.47%20L40.78%204.04Z%27%20fill%3D%27%2317745A%27/%3E%3Cpath%20d%3D%27M28%203%20L31%207%20L28%2011%20L25%207Z%20M0%203%20L3%207%20L0%2011Z%20M56%203%20L53%207%20L56%2011Z%27%20fill%3D%27%23B5502F%27/%3E%3Ccircle%20cx%3D%2714%27%20cy%3D%277%27%20r%3D%271.3%27%20fill%3D%27%23D4A23A%27/%3E%3Ccircle%20cx%3D%2742%27%20cy%3D%277%27%20r%3D%271.3%27%20fill%3D%27%23D4A23A%27/%3E%3Crect%20width%3D%2756%27%20height%3D%271%27%20fill%3D%27%23D4A23A%27/%3E%3Crect%20y%3D%2713%27%20width%3D%2756%27%20height%3D%271%27%20fill%3D%27%23D4A23A%27/%3E%3C/svg%3E") repeat-x;background-size:56px 14px}
.tabbar{border-top:0}
.hero h1,.dayhead h2,.dayhead .num,.dt b,.riadcard h2,.sheet h2,.sub,.dn b{font-family:var(--display);font-weight:700}
.hero h1{font-size:clamp(38px,11.5vw,64px);letter-spacing:.04em}
.dayhead h2{font-size:26px;line-height:1.15}
.dayhead .num{font-size:60px}
.dt b{font-size:18px}.dn b{font-size:26px}
.riadcard h2{font-size:21px;line-height:1.25}
.sub{font-size:22px}
.sheet h2{font-size:clamp(28px,8vw,40px)}
.ar{font-family:'Amiri',Georgia,serif;font-weight:700;direction:rtl}
.hero .ar{font-size:34px;line-height:1.1;color:#F0C766;margin:0 0 2px;text-shadow:0 2px 10px rgba(0,0,0,.35);font-style:normal}
.sign .ar{font-size:26px;color:var(--saffron)}
.card{box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px rgba(212,162,58,.4)}
.riadcard,.daycard{box-shadow:inset 0 0 0 3px var(--surface),inset 0 0 0 4px rgba(212,162,58,.4)}
.tab[aria-selected="true"] .ti{border-radius:999px 999px 8px 8px;height:30px;margin-bottom:-2px}

<body>
<div id="lock"><h1>Marrakech</h1><p class="ar" lang="ar" dir="rtl">مراكش</p><p class="t">Carnet de voyage privé</p>
<input type="password" id="pw" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe">
<label><input type="checkbox" id="remember" checked> Rester connecté sur cet appareil</label>
<button id="unlockbtn" type="button">Ouvrir</button><p class="err" id="err" role="alert"></p></div>
<div id="shell"></div>
<script>
window.initApp=function(){
  var tabs=[].slice.call(document.querySelectorAll('.tab')), screens=[].slice.call(document.querySelectorAll('.screen'));
  var order=tabs.map(function(t){return t.getAttribute('data-go')});
  var ids={12:'lundi',13:'mardi',14:'mercredi',15:'jeudi'};
  function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function load(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function go(id,keepScroll){
    if(order.indexOf(id)<0) id='home';
    screens.forEach(function(s){ s.hidden = (s.id !== 'screen-'+id); });
    tabs.forEach(function(t){ t.setAttribute('aria-selected', String(t.getAttribute('data-go')===id)); });
    if(!keepScroll) window.scrollTo(0,0);
    store('mk-tab',id);
  }
  /* today badge */
  var now=new Date(), todayId=(now.getFullYear()===2026 && now.getMonth()===9) ? ids[now.getDate()] : null;
  if(todayId){
    var t=document.querySelector('.tab[data-go="'+todayId+'"]'); if(t) t.classList.add('is-today');
    var c=document.querySelector('.daycard[data-go="'+todayId+'"] .today'); if(c) c.hidden=false;
  }
  /* clicks */
  document.addEventListener('click',function(e){
    var g=e.target.closest('[data-go]'); if(g){ go(g.getAttribute('data-go')); return; }
    var h=e.target.closest('.head[aria-controls]'); if(h){
      var p=document.getElementById(h.getAttribute('aria-controls')), open=h.getAttribute('aria-expanded')==='true';
      h.setAttribute('aria-expanded', String(!open)); p.hidden=open; return;
    }
    var x=e.target.closest('.expandall'); if(x){
      var scr=x.closest('.screen'), heads=[].slice.call(scr.querySelectorAll('.head[aria-controls]'));
      var openAll=x.getAttribute('data-open')!=='1';
      heads.forEach(function(hh){ hh.setAttribute('aria-expanded',String(openAll)); document.getElementById(hh.getAttribute('aria-controls')).hidden=!openAll; });
      x.setAttribute('data-open',openAll?'1':'0'); x.textContent=openAll?'Tout replier':'Tout déplier';
    }
  });
  /* swipe between tabs */
  var sx=0,sy=0,tracking=false;
  document.getElementById('app').addEventListener('touchstart',function(e){
    if(e.target.closest('input,.overlay')) return; var t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true;
  },{passive:true});
  document.getElementById('app').addEventListener('touchend',function(e){
    if(!tracking) return; tracking=false; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(Math.abs(dx)>70 && Math.abs(dy)<45){
      var cur=order.indexOf((tabs.filter(function(b){return b.getAttribute('aria-selected')==='true'})[0]||tabs[0]).getAttribute('data-go'));
      var nxt=cur+(dx<0?1:-1); if(nxt>=0 && nxt<order.length) go(order[nxt]);
    }
  },{passive:true});
  /* keyboard on tab bar */
  document.querySelector('.tabbar').addEventListener('keydown',function(e){
    if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
    var cur=order.indexOf(document.activeElement.getAttribute('data-go')); if(cur<0) return;
    var nxt=(cur+(e.key==='ArrowRight'?1:-1)+order.length)%order.length; tabs[nxt].focus(); go(order[nxt]);
  });
  /* driver sheet */
  var ov=document.getElementById('driver'), sd=document.getElementById('showdriver');
  function closeOv(){ ov.hidden=true; if(sd) sd.focus(); }
  if(sd) sd.addEventListener('click',function(){ ov.hidden=false; document.getElementById('closedriver').focus(); });
  document.getElementById('closedriver').addEventListener('click',closeOv);
  ov.addEventListener('click',function(e){ if(e.target===ov) closeOv(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape' && !ov.hidden) closeOv(); });
  var cb=document.getElementById('copyaddr'), cs=document.getElementById('copystatus');
  cb.addEventListener('click',function(){
    var txt=cb.getAttribute('data-text');
    function done(ok){ cs.textContent=ok?'Adresse copiée':'Copie impossible'; cb.textContent=ok?'Adresse copiée ✓':'Copie impossible'; setTimeout(function(){cb.textContent="Copier l'adresse"},1800); }
    try{
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){done(true)},function(){fallback()}); }
      else fallback();
    }catch(e){ fallback(); }
    function fallback(){ try{ var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); var ok=document.execCommand('copy'); document.body.removeChild(ta); done(ok);}catch(e){done(false)} }
  });
  /* start screen: today during the trip, else last visited */
  go(todayId || load('mk-tab') || 'home', true);
  /* converter */
  var eur=document.getElementById('eur'), mad=document.getElementById('mad'), rate=document.getElementById('rate');
  var saved=load('mk-rate'); if(saved) rate.value=saved;
  function num(v){var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:null}
  function fmt(n){return (Math.round(n*100)/100).toString().replace('.',',')}
  function fromEur(){var e=num(eur.value),r=num(rate.value);mad.value=(e===null||r===null)?'':fmt(e*r)}
  function fromMad(){var m=num(mad.value),r=num(rate.value);eur.value=(m===null||!r)?'':fmt(m/r)}
  eur.addEventListener('input',fromEur); mad.addEventListener('input',fromMad);
  rate.addEventListener('input',function(){ store('mk-rate',rate.value); fromEur(); });
  [eur,mad].forEach(function(el){el.addEventListener('focus',function(){el.select()})});
  fromEur();

  var lk=document.getElementById('lockbtn');
  if(lk) lk.addEventListener('click',function(){ try{localStorage.removeItem('mk-key')}catch(e){} location.reload(); });
};

</script>
